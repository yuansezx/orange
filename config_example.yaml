
core:
  app_name: orange
  app_version: example
  debug: false
  # 服务监听地址（容器内需改为 0.0.0.0）
  host: 0.0.0.0
  port: 8100
  # 日志存放位置，默认是项目根目录下的logs目录
  logs_dir: ./logs
  # 启用的业务模块（core 按约定 app.{模块}.infrastructure.persistence.{后端}.models 汇总模型）
  modules:
    - iam
  # 持久化（数据库）配置
  persistence:
    # 选择 ORM 后端
    backend: tortoise
    # 启动时是否自动迁移；关闭则改为手动运行 migrate.py
    auto_migrate: true
    use_tz: true
    timezone: Asia/Shanghai
    # 连接映射：{连接名: {dialect, credentials}}；engine 由方言层补，库名在 credentials 内
    options:
      default:
        dialect: postgres
        credentials:
          host: 127.0.0.1
          port: 5432
          user: orange
          password: orange
          database: orange
  # 缓存配置（可选；不配则 core 不启动缓存）
  cache:
    backend: redis
    options:
      host: 127.0.0.1
      port: 6379
      password: redis
      db: 0

iam:
  jwt_config:
    secret_key:
    algorithm: HS256
