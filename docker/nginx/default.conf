server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限按业务模块配置（当前 200MB），留出余量
    client_max_body_size 256m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API（FastAPI 全局前缀 /api；proxy_pass 不带 URI，保留原始路径）
    location /api/ {
        proxy_pass http://app:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # FastAPI 自带的 OpenAPI 文档挂在根路径，默认会被 SPA fallback 吃掉；
    # 不需要对外暴露时删掉这三个 location 即可。
    location = /openapi.json {
        proxy_pass http://app:8100;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://app:8100;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://app:8100;
        proxy_set_header Host $host;
    }

    # Vite 产物带内容哈希，可长期缓存；index.html 不缓存，保证发版即时生效
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
