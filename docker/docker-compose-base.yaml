name: orange

services:
  redis:
    image: redis:8.2.4
    container_name: orange-redis
    restart: unless-stopped
    #    ports:
    #      - "6379:6379"
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-orange-redis}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orange-redis}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s

  postgres:
    image: postgres:17.10
    container_name: orange-postgres
    restart: unless-stopped
#    ports:
#      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orange-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s

  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: orange-rustfs
    restart: unless-stopped
#    ports:
#      - "9000:9000"   # S3 API
#      - "9001:9001"   # Console（可选，可关掉减少暴露面）
    volumes:
      - rustfs_data:/data   # 你的命名卷，自定义前缀
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-orange}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-orange-rustfs}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s



networks:
  default:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rustfs_data:
