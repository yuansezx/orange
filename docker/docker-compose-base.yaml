# 基础栈（底座：redis / postgres / rustfs）：不含宿主机端口，靠容器网络互通。
# 开发：与 override 叠加；部署：docker-compose.yaml 通过 include 引入本文件。
#   docker compose -f docker/docker-compose-base.yaml -f docker/docker-compose.override.yaml up -d
name: orange

services:
  redis:
    image: redis:8.2.4
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-orange-redis}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orange-redis}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s

  postgres:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      # 超管口令：仅容器初始化使用
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orange-postgres}
      # 应用账号：首次初始化（空数据目录）时由 postgres/init.sh 创建
      # 需与 config 里 persistence.credentials 的 user / password / database 一致
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-orange}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-orange-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-orange}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      # 初始化阶段的临时 server 只监听 Unix socket；走 TCP 探活，避免 init 期间误判健康。
      # start_period 覆盖 initdb + init.sh + 重启正式 server 的时间（NAS 上可能较慢）。
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-orange}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-orange-rustfs}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  default:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rustfs_data:
